apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: wanderlust
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alirazaakram/wanderlust-frontend-beta:0f190a7383d9f2534a1af53707f72a861ddfb696
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://a69ecef3d4d6d4000ac5e6b7ce408443-508755135.us-east-1.elb.amazonaws.com:8080"
            - name: REACT_APP_API_URL
              value: "http://a69ecef3d4d6d4000ac5e6b7ce408443-508755135.us-east-1.elb.amazonaws.com:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: wanderlust
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP